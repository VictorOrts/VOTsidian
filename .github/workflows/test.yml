name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-26   # macOS 26: la app es solo para macOS 26 o posterior
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'   # Swift 6.3: el más nuevo de las máquinas de GitHub (Package.swift pide 6.3)
      - run: swift --version
      - run: swift test
      - name: Compilar la app (release) y comprobar que se empaqueta
        run: |
          ./scripts/build-app.sh
          test -x build/VOTsidian.app/Contents/MacOS/VOTsidian
