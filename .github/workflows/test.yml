name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable   # Package.swift pide swift-tools-version 6.4
      - run: swift --version
      - run: swift test
      - name: Compilar la app (release) y comprobar que se empaqueta
        run: |
          ./scripts/build-app.sh
          test -x build/VOTsidian.app/Contents/MacOS/VOTsidian
