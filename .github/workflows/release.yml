name: release
# Al subir una etiqueta v1.2 (git tag v1.2 && git push origin v1.2): tests, app, .dmg y release en GitHub con el .dmg adjunto.
# Firma y notarización solo si están los secretos; sin ellos el .dmg sale con firma ad hoc (macOS pedirá abrirla con clic derecho).
#   MACOS_CERT_P12        certificado «Developer ID Application» exportado como .p12, en base64 (base64 -i cert.p12 | pbcopy)
#   MACOS_CERT_PASSWORD   contraseña de ese .p12
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD   Apple ID, equipo y contraseña de app para notarytool
on:
  push:
    tags: ['v*']
permissions:
  contents: write   # crear la release y subir el .dmg
jobs:
  release:
    runs-on: macos-27
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # el número de compilación es el nº de commits
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - run: swift test

      - name: Importar el certificado
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/firma.keychain-db"
          KCPASS="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          test -n "$ID" || { echo "El .p12 no trae un certificado Developer ID Application"; exit 1; }
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"

      - name: Compilar la app
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Crear el .dmg
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R build/VOTsidian.app "$STAGE/"
          ln -s /Applications "$STAGE/Aplicaciones"
          DMG="build/VOTsidian-$VERSION.dmg"
          hdiutil create -volname "VOTsidian $VERSION" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          if [ -n "${SIGN_ID:-}" ]; then codesign --force --timestamp --sign "$SIGN_ID" "$DMG"; fi
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarizar
        if: env.SIGN_ID != '' && env.NOTARY_APPLE_ID != ''
        run: |
          xcrun notarytool submit "$DMG" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${SIGN_ID:-}" ] && [ -n "${NOTARY_APPLE_ID:-}" ]; then NOTE="Firmada y notarizada."
          else NOTE="Sin notarizar: la primera vez ábrela con clic derecho → Abrir."; fi
          gh release create "$GITHUB_REF_NAME" "$DMG" --verify-tag --title "VOTsidian $VERSION" --generate-notes --notes "$NOTE"
